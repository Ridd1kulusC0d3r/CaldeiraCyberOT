name: Referências OT · links internos
on:
  push:
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/validar_referencias.py"
      - ".github/workflows/validar-referencias.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/validar_referencias.py"
      - ".github/workflows/validar-referencias.yml"
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar referências relativas sem acessar rede
        run: python scripts/validar_referencias.py
