name: Caldeira OT Labs · Testes offline
on:
  push:
    paths:
      - "core/**"
      - "cases/**"
      - "manometro/**"
      - "tests/**"
      - ".github/workflows/ot-labs-tests.yml"
  pull_request:
    paths:
      - "core/**"
      - "cases/**"
      - "manometro/**"
      - "tests/**"
      - ".github/workflows/ot-labs-tests.yml"
jobs:
  offline-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate synthetic-only offline detections
        run: python -m unittest discover -s tests -v
      - name: Validate case catalogue
        run: python scripts/validar_catalogo.py
      - name: Manometro demo report (offline)
        run: |
          python -m manometro analisar manometro/fixtures/demo-xdome.json --de 2026-01 --ate 2026-10 --json saida/manometro-demo.json --html saida/manometro-demo.html
          python -m manometro verificar saida/manometro-demo.json
