<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-labelledby="pt pd">
  <title id="pt">Caldeira | Modelo Purdue: referência didática, não topologia universal</title>
  <desc id="pd">Livro-razão com os níveis L5 a L0; a DMZ industrial L3.5 é a única linha marcada em cobre, como fronteira entre IT e OT.</desc>
  <rect width="1240" height="720" fill="#f3f0e8"/>
  <rect x="0.5" y="0.5" width="1239" height="719" fill="none" stroke="#17150f"/>
  <g font-family="'Courier New',Courier,monospace" font-size="12" letter-spacing="2" fill="#4a463c" font-weight="700">
    <text x="58" y="48">CALDEIRA / ARCHITECTURE MAP 01</text>
    <text x="1182" y="48" text-anchor="end">MODELO DIDÁTICO</text>
  </g>
  <line x1="58" y1="64" x2="1182" y2="64" stroke="#17150f"/>
  <text x="58" y="122" font-family="Georgia,'Times New Roman',serif" font-size="42" font-weight="700" fill="#17150f" letter-spacing="-1">Zonas de referência Purdue</text>
  <text x="60" y="154" font-family="Georgia,'Times New Roman',serif" font-size="19" font-style="italic" fill="#4a463c">Contexto lógico para estudos defensivos. A arquitetura real depende do processo.</text>
  <g font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="2" fill="#68635a" font-weight="700">
    <text x="58" y="196">NÍVEL</text><text x="170" y="196">FUNÇÃO</text><text x="1182" y="196" text-anchor="end">DOMÍNIO</text>
  </g>
