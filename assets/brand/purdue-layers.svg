    <g><text x="58" y="248" font-family="'Courier New',Courier,monospace" font-weight="700" font-size="22">L5</text><text x="170" y="248">Enterprise / conectividade externa</text><text x="1182" y="248" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="13" letter-spacing="2" fill="#68635a" font-weight="700">IT</text></g>
    <line x1="58" y1="270" x2="1182" y2="270" stroke="#cfc9ba"/>
