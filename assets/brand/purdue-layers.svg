  <line x1="58" y1="642" x2="1182" y2="642" stroke="#17150f"/>
  <text x="58" y="678" font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="1.5" fill="#68635a" font-weight="700">REFERÊNCIA: PURDUE / ISA-95. NÍVEIS SÃO ABSTRAÇÕES, NÃO REGRAS UNIVERSAIS DE FIREWALL.</text>
