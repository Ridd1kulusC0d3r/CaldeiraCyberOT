    <line x1="58" y1="456" x2="1182" y2="456" stroke="#cfc9ba"/>
    <g><text x="58" y="496" font-family="'Courier New',Courier,monospace" font-weight="700" font-size="22">L2</text><text x="170" y="496">Supervisão / HMI e sistemas SCADA</text><text x="1182" y="496" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="13" letter-spacing="2" fill="#68635a" font-weight="700">OT</text></g>
    <line x1="58" y1="518" x2="1182" y2="518" stroke="#cfc9ba"/>
