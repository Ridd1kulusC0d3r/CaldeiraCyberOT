    <rect x="58" y="334" width="5" height="60" fill="#9c4a0c"/>
    <g><text x="76" y="372" font-family="'Courier New',Courier,monospace" font-weight="700" font-size="22" fill="#9c4a0c">L3.5</text><text x="170" y="372">DMZ industrial / intermediação de serviços</text><text x="1168" y="372" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="13" letter-spacing="2" fill="#9c4a0c" font-weight="700">FRONTEIRA</text></g>
    <line x1="58" y1="394" x2="1182" y2="394" stroke="#9c4a0c"/>
