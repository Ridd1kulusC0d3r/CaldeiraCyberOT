    <text x="1232" y="44" text-anchor="end">TLP:CLEAR</text>
  </g>
  <line x1="48" y1="62" x2="1232" y2="62" stroke="#17150f"/>
  <text x="48" y="166" font-family="Georgia,'Times New Roman',serif" font-size="80" font-weight="700" fill="#17150f" letter-spacing="-2">Caldeira</text>
  <text x="50" y="210" font-family="Georgia,'Times New Roman',serif" font-size="24" font-style="italic" fill="#4a463c">Pesquisa OT/ICS, detecção e evidência verificável.</text>
  <text x="50" y="240" font-family="Georgia,'Times New Roman',serif" font-size="24" font-style="italic" fill="#4a463c">Sem tocar em processo real.</text>
  <line x1="50" y1="268" x2="170" y2="268" stroke="#9c4a0c" stroke-width="4"/>
