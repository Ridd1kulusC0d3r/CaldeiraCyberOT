<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Caldeira Cyber OT Labs: inteligência de ameaças, engenharia de detecção e pesquisa em segurança industrial</title>
  <desc id="d">Capa em papel e tinta com o nome Caldeira em serifa e um desenho técnico esquemático de um vaso de pressão com manômetro; o ponteiro do manômetro é o único elemento em cobre.</desc>
  <rect width="1280" height="340" fill="#f3f0e8"/>
